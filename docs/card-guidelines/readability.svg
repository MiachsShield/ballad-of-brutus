<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Georgia, serif">
  <defs>
    <linearGradient id="iron" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b5a58"/><stop offset=".5" stop-color="#3a3937"/><stop offset="1" stop-color="#2a2927"/></linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a6a40"/><stop offset=".5" stop-color="#6b4526"/><stop offset="1" stop-color="#4a2e18"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8dade"/><stop offset=".45" stop-color="#8e9298"/><stop offset="1" stop-color="#5d6167"/></linearGradient>
    <linearGradient id="gilt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2a14"/><stop offset=".35" stop-color="#b08a4a"/><stop offset=".5" stop-color="#e9d6a8"/><stop offset=".65" stop-color="#8a6a36"/><stop offset="1" stop-color="#2a1d0e"/></linearGradient>
    <radialGradient id="face" cx=".5" cy=".6" r=".7"><stop offset="0" stop-color="#3a3044"/><stop offset="1" stop-color="#14111a"/></radialGradient>
  </defs>
  <rect width="960" height="560" fill="#15121a"/>
  <text x="24" y="38" fill="#e8dfcf" font-size="22">Readability without colour: glyph = category, metal = rarity</text>
  <text x="24" y="62" fill="#a89f92" font-size="14">Glyphs are bone-on-ink, never tinted. Frame metal is finish, not hue. Category colour stays in the art's light only.</text>

  <g fill="none" stroke="#e8dfcf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(70,130)"><circle r="30" fill="#1c1822" stroke="#6f6676" stroke-width="2"/><path d="M-12 12 L12 -12 M4 -12 L12 -12 L12 -4 M-14 6 L-6 14"/></g>
    <g transform="translate(230,130)"><circle r="30" fill="#1c1822" stroke="#6f6676" stroke-width="2"/><path d="M0 -15 L13 -9 L13 2 C13 10 6 15 0 17 C-6 15 -13 10 -13 2 L-13 -9 Z"/></g>
    <g transform="translate(390,130)"><circle r="30" fill="#1c1822" stroke="#6f6676" stroke-width="2"/><path d="M0 -16 C8 -5 12 2 12 7 C12 14 6 17 0 17 C-6 17 -12 14 -12 7 C-12 2 -8 -5 0 -16 Z M0 1 V11 M-5 6 H5"/></g>
    <g transform="translate(550,130)"><circle r="30" fill="#1c1822" stroke="#6f6676" stroke-width="2"/><path d="M-11 4 L0 -7 L11 4 M-11 14 L0 3 L11 14"/></g>
    <g transform="translate(710,130)"><circle r="30" fill="#1c1822" stroke="#6f6676" stroke-width="2"/><path d="M-11 -14 L0 -3 L11 -14 M-11 -4 L0 7 L11 -4"/><circle cx="0" cy="13" r="2.5" fill="#e8dfcf"/></g>
    <g transform="translate(870,130)"><circle r="30" fill="#1c1822" stroke="#e8dfcf" stroke-width="3"/><path d="M0 -17 L4 -4 L17 0 L4 4 L0 17 L-4 4 L-17 0 L-4 -4 Z" fill="#e8dfcf"/></g>
  </g>
  <g fill="#e8dfcf" font-size="15" text-anchor="middle">
    <text x="70" y="186">Offense</text><text x="230" y="186">Defense</text><text x="390" y="186">Heal</text>
    <text x="550" y="186">Buff</text><text x="710" y="186">Debuff</text><text x="870" y="186">Finisher</text>
  </g>
  <g fill="#8a8178" font-size="12" text-anchor="middle">
    <text x="70" y="204">blade</text><text x="230" y="204">shield</text><text x="390" y="204">drop + cross</text>
    <text x="550" y="204">up chevrons</text><text x="710" y="204">down + drip</text><text x="870" y="204">star, solid, thick ring</text>
  </g>

  <g font-size="15" text-anchor="middle">
    <g transform="translate(60,250)">
      <rect width="170" height="250" rx="10" fill="url(#iron)"/><rect x="9" y="9" width="152" height="232" rx="6" fill="url(#face)"/>
      <circle cx="140" cy="30" r="15" fill="#1c1822" stroke="#6f6676" stroke-width="1.5"/><path d="M134 36 L146 24 M142 24 L146 24 L146 28" stroke="#e8dfcf" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="85" cy="150" r="34" fill="#E0553A" opacity=".35"/><circle cx="85" cy="150" r="14" fill="#E0553A" opacity=".8"/>
      <text x="85" y="280" fill="#e8dfcf">Common: iron</text><text x="85" y="298" fill="#8a8178" font-size="12">matte, no shine</text>
    </g>
    <g transform="translate(280,250)">
      <rect width="170" height="250" rx="10" fill="url(#bronze)"/><rect x="9" y="9" width="152" height="232" rx="6" fill="url(#face)"/>
      <circle cx="140" cy="30" r="15" fill="#1c1822" stroke="#6f6676" stroke-width="1.5"/><path d="M140 20 L150 24 L150 31 C150 36 145 39 140 40 C135 39 130 36 130 31 L130 24 Z" stroke="#e8dfcf" stroke-width="2" fill="none"/>
      <circle cx="85" cy="150" r="34" fill="#7FA8D6" opacity=".35"/><circle cx="85" cy="150" r="14" fill="#7FA8D6" opacity=".8"/>
      <text x="85" y="280" fill="#e8dfcf">Uncommon: bronze</text><text x="85" y="298" fill="#8a8178" font-size="12">warm brown, soft sheen</text>
    </g>
    <g transform="translate(500,250)">
      <rect width="170" height="250" rx="10" fill="url(#silver)"/><rect x="9" y="9" width="152" height="232" rx="6" fill="url(#face)"/>
      <circle cx="140" cy="30" r="15" fill="#1c1822" stroke="#6f6676" stroke-width="1.5"/><path d="M140 19 C145 26 147 30 147 33 C147 37 144 39 140 39 C136 39 133 37 133 33 C133 30 135 26 140 19 Z" stroke="#e8dfcf" stroke-width="2" fill="none"/>
      <circle cx="85" cy="150" r="34" fill="#8FD1A0" opacity=".35"/><circle cx="85" cy="150" r="14" fill="#8FD1A0" opacity=".8"/>
      <text x="85" y="280" fill="#e8dfcf">Rare: silver</text><text x="85" y="298" fill="#8a8178" font-size="12">cool, bright edge highlight</text>
    </g>
    <g transform="translate(720,250)">
      <rect width="170" height="250" rx="10" fill="url(#gilt)"/><rect x="9" y="9" width="152" height="232" rx="6" fill="url(#face)"/>
      <path d="M20 9 L40 9 L9 40 L9 20 Z" fill="#fff4dc" opacity=".35"/>
      <circle cx="140" cy="30" r="15" fill="#1c1822" stroke="#e8dfcf" stroke-width="2.5"/><path d="M140 19 L143 27 L151 30 L143 33 L140 41 L137 33 L129 30 L137 27 Z" fill="#e8dfcf"/>
      <circle cx="85" cy="150" r="40" fill="#FFF4DC" opacity=".25"/><circle cx="85" cy="150" r="16" fill="#FFF4DC" opacity=".9"/>
      <text x="85" y="280" fill="#e8dfcf">Unique: blackened gilt</text><text x="85" y="298" fill="#8a8178" font-size="12">dark metal + slow light sweep</text>
    </g>
  </g>
</svg>

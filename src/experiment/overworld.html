<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personality experiment</title>
<style>
:root{--bg:#101b22;--panel:#16252d;--panel2:#1c2f38;--line:#9d815640;--ink:#f4eddb;--dim:#aab9ba;--gold:#d8b46a;--good:#7fbf6a;--bad:#e07a6a;--warn:#e0b25a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,sans-serif}
button{font:inherit;color:var(--ink);background:#273c43;border:1px solid #a28b63;padding:6px 14px;cursor:pointer;border-radius:3px}
button:hover:not(:disabled){background:#30505a}
button:disabled{opacity:.45;cursor:not-allowed}
button.go{background:#a28b63;color:#101b22;font-weight:600}
button.go:hover:not(:disabled){background:#c4a874}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 20px;border-bottom:1px solid var(--line)}
.tag{font:600 11px/1 system-ui;letter-spacing:.12em;text-transform:uppercase;color:#101b22;background:var(--warn);padding:5px 8px;border-radius:2px}
.title{font:600 20px Georgia,serif}
.stat{color:var(--dim)} .stat b{color:var(--ink);font-weight:600}
.spacer{flex:1}
.wrap{display:flex;min-height:calc(100dvh - 60px)}
nav{width:190px;flex:none;border-right:1px solid var(--line);padding:12px 0}
nav button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:10px 18px;border-radius:0}
nav button[aria-current=page]{border-left-color:var(--gold);background:var(--panel)}
main{flex:1;padding:18px 22px;max-width:980px}
h2{font:600 18px Georgia,serif;margin:0 0 4px}
.sub{color:var(--dim);margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin:0 0 12px}
.quote{font:17px/1.4 Georgia,serif;margin:0 0 6px}
.who{color:var(--gold);font-weight:600}
.fact{color:var(--dim);margin:0}
.you{border-color:#d8b46a99}
details{margin-top:8px;color:var(--dim)} summary{cursor:pointer;font-size:12px;letter-spacing:.04em}
details ol{margin:6px 0 0 18px;padding:0} details li{margin:2px 0}
.empty{color:var(--dim);font-style:italic}
input[type=search]{width:100%;max-width:340px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:3px;margin:0 0 12px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:12px;letter-spacing:.04em}
td.r{width:34px;font-weight:700;color:var(--gold)}
tr.row{cursor:pointer} tr.row:hover td{background:var(--panel)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.gone{opacity:.45}
.muted{color:var(--dim)}
.pill{display:inline-block;font-size:12px;padding:1px 7px;border:1px solid var(--line);border-radius:10px;color:var(--dim)}
dialog{background:var(--panel2);color:var(--ink);border:1px solid #a28b63;border-radius:6px;max-width:560px;width:calc(100% - 32px);padding:18px 20px}
dialog::backdrop{background:#000a}
dialog h3{font:600 20px Georgia,serif;margin:0 0 2px}
dialog ul{margin:4px 0 10px 18px;padding:0}
.row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.notice{background:#2a3a1f;border:1px solid #7fbf6a66;padding:8px 12px;border-radius:3px;margin:0 0 12px}
.notice.bad{background:#3a221f;border-color:#e07a6a66}
.pips{color:var(--gold);letter-spacing:2px}
.deck{display:inline-flex;gap:6px;align-items:center}
.deck button[aria-pressed=true]{background:#a28b63;color:#101b22}
.nums td:last-child{text-align:right;font-variant-numeric:tabular-nums}
svg text{fill:var(--dim);font-size:11px}
@media (max-width:720px){.wrap{display:block}nav{width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:0}nav button{width:auto;border-left:0;border-bottom:3px solid transparent;white-space:nowrap}nav button[aria-current=page]{border-bottom-color:var(--gold)}main{padding:14px 16px}th:nth-child(5),td:nth-child(5){display:none}}
</style>
</head>
<body>
<div class="top">
  <span class="tag">Personality experiment</span>
  <span class="title">The region</span>
  <span class="stat">Week <b id="week">0</b></span>
  <span class="stat">Brutus's gold <b id="gold">0</b></span>
  <span class="spacer"></span>
  <button id="newWorld" title="Start a fresh region with a new seed">New region</button>
  <button id="end" class="go">End week</button>
</div>
<div class="wrap">
  <nav aria-label="Sections">
    <button data-tab="bulletin" aria-current="page">Bulletin</button>
    <button data-tab="expeditions">Expeditions</button>
    <button data-tab="people">People</button>
    <button data-tab="guilds">Guilds</button>
    <button data-tab="stakes">Your stakes</button>
    <button data-tab="numbers">World numbers</button>
  </nav>
  <main id="main"></main>
</div>
<dialog id="profile"></dialog>
<script>/*SIM*/</script>
<script>
(function(){
'use strict';
var S=window.PXSim, KEY='brutus-personality-experiment-v1', w=null, tab='bulletin', notice=null, query='';
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(n){return Math.round(n).toLocaleString('en-US');}
function person(id){return id===S.BRUTUS?{name:'Brutus',id:S.BRUTUS}:w.people[id];}

// ---- save / load: the whole world, exactly, so a reload plays out the same (about 2.5 MB a year) ----
function save(){try{localStorage.setItem(KEY,JSON.stringify(w));}catch(e){notice={bad:true,text:'This week could not be saved in this browser (storage full or blocked). The region lasts until you close the page.'};}}
function load(){try{var j=localStorage.getItem(KEY);if(j){w=JSON.parse(j);return true;}}catch(e){}return false;}
function fresh(seed){w=S.create(seed>>>0);for(var i=0;i<4;i++)S.step(w);save();}   // four quiet weeks so the bulletin has history

// ---- voices: one line from someone who'd care, then the facts ----
function speakerFor(e){
  var actors=e.actors.filter(function(a){return a!==S.BRUTUS;});
  if(!actors.length)return null;
  var a=w.people[actors[0]], best=null, bestV=-1;
  for(var i=0;i<w.people.length;i++){var p=w.people[i];
    if(!p.alive||e.actors.indexOf(p.id)>=0)continue;
    var v=(a.kin.indexOf(p.id)>=0?200:0)+(p.lover===a.id?150:0)+Math.abs(p.feel[a.id]||0)+(p.guild!=null&&p.guild===a.guild?20:0);
    if(v>bestV){bestV=v;best=p;}}
  return best;
}
function voice(e){
  var n=e.actors.map(function(i){return person(i).name;}), k=e.kind, A=n[0], B=n[1], C=n[2];
  var V={
    walkout:'"'+A+' finally walked out. I give it a week before they\'re begging somewhere else."',
    poach:'"Did you hear what '+B+' got paid to switch? I\'m in the wrong line of work."',
    follow:'"'+A+' went wherever '+B+' went. Some people have no spine. Or too much heart."',
    coup:'"'+A+' runs the place now. '+B+' didn\'t see it coming. Nobody ever does."',
    succession:'"'+A+' is in charge now. Let\'s see how long that lasts."',
    purge:'"'+A+' threw '+B+' out the first chance they got. Saw that coming a mile off."',
    collapse:'"Whole hall boarded up. I used to drink there."',
    founding:'"'+A+' has a guild of their own now. Bold. Or stupid."',
    exposed:'"You haven\'t heard? Oh, you haven\'t heard."',
    accusation:'"'+A+' says '+B+' robbed them. '+B+' says '+A+' can go to the deep."',
    murder:'"They\'re still scrubbing the tavern floor. '+B+'. Over nothing."',
    riot:'"I was there. '+A+' stood on a barrel and the whole street just went."',
    death:'"'+A+' didn\'t come back up. Nobody\'s cleared their bunk yet."',
    ruin:'"Saw '+A+' in the slums. Didn\'t say hello. Didn\'t know what to say."',
    humiliation:'"'+A+' made '+B+' look like a fool in front of everyone. '+B+' won\'t forget it."',
    swindle:'"Never do business with '+A+'. Ask '+B+'."',
    revenge:'"'+A+' got even with '+B+'. Took long enough."',
    scapegoat:'"They threw '+A+' out for it. '+A+'? Please."',
    defection:'"'+A+' just upped and left. For the contracts, they say. Sure."',
    stake:e.brutus?'"Brutus put money on '+A+'. Brutus! On '+A+'!"':'"'+A+' put money on '+B+'. Must know something we don\'t."',
    snub:'"'+A+' is still sore that '+(e.brutus?'you':'someone else')+' backed '+B+' instead."',
    assault:'"'+B+'\'s face. You should see '+B+'\'s face."',
    rise:'"'+A+'\'s wearing a new rank badge and won\'t shut up about it."',
    fall:'"'+A+' got busted down a rank. Couldn\'t pay for their kit."',
    heir:'"New face in town. '+A+'. Says they\'re kin to someone. Wouldn\'t say who."',
    inherit:'"'+A+' came into money. Funeral money. Doesn\'t look happy about it."',
    devoted:e.brutus?null:'"'+A+' would walk into fire for '+B+'. I\'ve seen it."',
    hostile:e.brutus?null:'"Whatever '+B+' did to '+A+', '+A+' is making them pay for it."',
    haul:'"'+A+' came up with a fortune. Drinks are on '+A+', apparently."',
    crime:'"They finally caught '+A+'. About time."',
    duel:'"Half the town bet on that duel. The other half bet wrong."',
    twist:'"'+A+' was only supposed to charm '+B+'. Now look at them."',
    blackmail:'"'+B+' looks like someone who\'s paying for silence."',
    signing:'"'+A+' signed with a new crew. Fresh coat, same smile."',
    loyal:'"'+A+' turned down a fortune to stay put. Fool or saint, I can\'t decide."',
    switch:'"'+A+' changed guilds for a better cut. Can\'t blame them."',
    undercut:'"'+A+' took '+B+'\'s contract right out from under them."',
    crackdown:'"'+A+' put '+B+' in their place in front of everyone."',
    betrayal:'"'+A+' sold '+B+' out. For money. Of course for money."',
    report:'"'+A+' went to the watch about '+B+'. Before anything even happened."',
    brawl:'"'+A+' picked a fight with '+B+' for fun. For fun!"',
    callout:'"'+A+' told '+B+' exactly what everyone was thinking."',
    odd:'"'+A+' thanked '+B+' for hitting them. I\'m not making this up."',
    return:'"'+A+' crawled back out of the slums. Good for them."',
    claim:'"'+A+' walked out of '+(e.place||'that place')+' like it was nothing. Next round\'s on '+A+'."'
  };
  if(k==='expedition'){
    var fans=S.alive(w).filter(function(p){return p.feel[S.BRUTUS]!=null;});
    var sp=e.won?fans.sort(function(a,b){return b.feel[S.BRUTUS]-a.feel[S.BRUTUS];})[0]:fans.sort(function(a,b){return a.feel[S.BRUTUS]-b.feel[S.BRUTUS];})[0];
    var f=sp?sp.feel[S.BRUTUS]:0;
    var line=e.won?(f>40?'"Told you. Told every one of you."':'"Fine. He did it. Doesn\'t mean I have to like him."')
      :e.downed?(f<-30?'"Carried out like a sack of turnips. Best thing I\'ve seen all year."':'"Rough one. He\'ll be back down there, you watch."')
      :'"Came back with nothing. Happens to everyone. Mostly to him."';
    return {speaker:sp||null,line:line};
  }
  if(e.brutus&&k==='devoted')return {speaker:person(e.actors[0]),line:'"You backed me when nobody would. This is yours."',toYou:true};
  if(e.brutus&&k==='hostile')return {speaker:null,line:'"I hear '+A+' has been selling stories about you. To anyone with a coin."',toYou:true};
  return {speaker:null,line:V[k]||null};
}

// ---- views ----
function card(e,isYou){
  var v=voice(e), sp=v.speaker||speakerFor(e);
  var who=sp?esc(sp.name)+':':'Someone at the bar:';
  var tr=S.chain(w,e.id), trace='';
  if(tr.length>1)trace='<details><summary>Trace this story ('+tr.length+' steps, playtest only)</summary><ol>'+tr.map(function(x){return '<li>Week '+x.week+': '+esc(x.text)+'</li>';}).join('')+'</ol></details>';
  return '<div class="card'+(isYou||e.brutus?' you':'')+'">'+(v.line?'<p class="quote"><span class="who">'+who+'</span> '+esc(v.line)+'</p>':'')+'<p class="fact">'+esc(e.text)+'</p>'+trace+'</div>';
}
function viewBulletin(){
  var h='<h2>Week '+w.week+'</h2><p class="sub">The three stories everyone is talking about this week.</p>';
  if(notice)h+='<div class="notice'+(notice.bad?' bad':'')+'">'+esc(notice.text)+'</div>';
  var b=S.bulletin(w,w.week,3);
  h+=b.length?b.map(function(e){return card(e);}).join(''):'<p class="empty">A quiet week. Nobody has anything worth repeating.</p>';
  var mine=w.events.filter(function(e){return e.week===w.week&&e.brutus&&b.indexOf(e)<0;});
  if(mine.length)h+='<h2 style="margin-top:22px">About you</h2><p class="sub">Things that touched Brutus this week.</p>'+mine.map(function(e){return card(e,true);}).join('');
  h+='<h2 style="margin-top:22px">Earlier weeks</h2>';
  for(var wk=w.week-1;wk>=Math.max(1,w.week-8);wk--){
    var bb=S.bulletin(w,wk,3);
    h+='<details><summary>Week '+wk+'</summary>'+(bb.length?bb.map(function(e){return card(e);}).join(''):'<p class="empty">Quiet.</p>')+'</details>';
  }
  return h;
}
function rankSort(a,b){return S.RANKS.indexOf(b.rank)-S.RANKS.indexOf(a.rank)||b.fame-a.fame;}
function backed(id){return w.stakes.some(function(s){return s.by===S.BRUTUS&&s.who===id&&s.left>0;});}
function viewPeople(){
  var ppl=S.alive(w).sort(rankSort).filter(function(p){return !query||p.name.toLowerCase().indexOf(query)>=0||S.gname(w,p.guild).toLowerCase().indexOf(query)>=0;});
  var h='<h2>People</h2><p class="sub">'+S.alive(w).length+' adventurers in the region. Nobody wears their personality on a label: read it from what they do.</p>';
  h+='<input type="search" id="q" placeholder="Search a name or a guild" value="'+esc(query)+'" aria-label="Search people">';
  h+='<table><thead><tr><th>Rank</th><th>Name</th><th>Guild</th><th>Getting by?</th><th></th></tr></thead><tbody>';
  ppl.slice(0,150).forEach(function(p){
    h+='<tr class="row" data-p="'+p.id+'"><td class="r">'+p.rank+'</td><td>'+esc(p.name)+(backed(p.id)?' <span class="pill">your stake</span>':'')+(p.jail?' <span class="pill">locked up</span>':'')+'</td><td class="muted">'+esc(S.gname(w,p.guild))+'</td><td class="muted">'+S.standing(p)+'</td><td><button data-p="'+p.id+'">Look</button></td></tr>';
  });
  h+='</tbody></table>'+(ppl.length>150?'<p class="muted">Showing 150 of '+ppl.length+'. Search to narrow it down.</p>':'');
  return h;
}
function viewGuilds(){
  var A=S.alive(w), h='<h2>Guilds</h2><p class="sub">A guild acts like the person who leads it.</p><div class="grid">';
  w.guilds.slice().sort(function(a,b){return (a.dead?1:0)-(b.dead?1:0);}).forEach(function(g){
    var mem=A.filter(function(p){return p.guild===g.id;}), L=S.leader(w,g.id);
    var hall=mem.reduce(function(s,p){return s+S.cost(p);},0)*.35+1, wk=g.treasury/hall;
    var money=g.dead?'folded':wk<0?'in debt':wk<3?'strained':wk<12?'steady':'flush';
    h+='<div class="card'+(g.dead?' gone':'')+'"><h2>'+esc(g.name)+'</h2><p class="fact">'+(g.dead?'Boarded up.':'Led by <button class="link" data-p="'+(L?L.id:'')+'" style="padding:1px 8px">'+esc(L?L.name:'nobody')+'</button>')+'</p>'+
      (g.dead?'':'<p class="fact">'+mem.length+' members · treasury '+money+'</p><p class="fact">'+mem.filter(function(p){return 'AS'.indexOf(p.rank)>=0;}).length+' A/S · '+mem.filter(function(p){return p.rank==='B';}).length+' B · '+mem.filter(function(p){return 'DC'.indexOf(p.rank)>=0;}).length+' C/D</p>')+'</div>';
  });
  return h+'</div>';
}
var DECKS=['Warrior','Priest'];
function viewExpeditions(){
  var no=S.canDelve(w), deck=w.brutus.deck||'Warrior', open=(w.board||[]).filter(function(d){return !d.closed;}).sort(function(a,b){return a.rank-b.rank;});
  var h='<h2>Expeditions</h2><p class="sub">Take Brutus into the real dungeon, alone, once a week. Whatever he leaves unfinished, someone else claims when it closes, and everyone hears how it went.</p>';
  if(notice)h+='<div class="notice'+(notice.bad?' bad':'')+'">'+esc(notice.text)+'</div>';
  h+='<p class="deck">Deck: '+DECKS.map(function(k){return '<button data-deck="'+k+'" aria-pressed="'+(k===deck)+'">'+k+'</button>';}).join('')+'</p>';
  if(no)h+='<p class="notice">'+esc(no)+'</p>';
  h+='<div class="grid">'+open.map(function(d){
    return '<div class="card"><p class="muted" style="margin:0">'+esc(d.region)+' · closes after week '+d.expires+'</p><h2>'+esc(d.name)+'</h2>'+
      '<p class="fact"><span class="pips" aria-label="Rank '+d.rank+' of 5">'+'●'.repeat(d.rank)+'○'.repeat(5-d.rank)+'</span> Rank '+d.rank+'</p>'+
      '<p class="fact">'+esc(d.desc)+'</p><p><b>'+esc(d.objective)+'</b> · '+fmt(d.reward)+' gold</p>'+
      (d.delve&&d.delve.checkpointLabel?'<p class="muted">Checkpoint saved: '+esc(d.delve.checkpointLabel)+'. You resume there.</p>':'')+
      '<button class="go" data-delve="'+d.id+'" '+(no?'disabled':'')+'>Go down</button></div>';
  }).join('')+'</div>';
  var done=(w.board||[]).filter(function(d){return d.closed&&d.by!=null;}).slice(-6).reverse();
  if(done.length)h+='<h2 style="margin-top:18px">Recently cleared</h2><ul>'+done.map(function(d){return '<li>'+esc(d.name)+' (rank '+d.rank+'): '+esc(d.by===S.BRUTUS?'Brutus':w.people[d.by].name)+'</li>';}).join('')+'</ul>';
  return h;
}
function loadout(){return {stats:{hp:0,energy:0,atk:2,def:0},procs:[],cards:[],setElements:[],deck:w.brutus.deck||'Warrior'};}
function deploy(id){
  var r=S.brutusDeploy(w,id);
  if(r.error){notice={bad:true,text:r.error};render();return;}
  save();notice=null;render();
  window.parent.postMessage({type:'enterDungeon',turn:w.week,loadout:loadout(),party:[],contract:r.contract,campaign:null},'*');
}
function returned(result){
  var r=S.brutusReturn(w,result);if(!r)return;
  if(r.failedToOpen)notice={bad:true,text:'The dungeon could not open. Nothing was spent; try again.'};
  else notice=r.won?{text:'Back up from '+r.dungeon.name+' with the job done. +'+fmt(r.reward)+' gold.'}:{bad:true,text:result.brutusDowned?'Brutus was dragged back up from '+r.dungeon.name+'. People will talk.':'Back from '+r.dungeon.name+' with the job unfinished.'+(r.dungeon.delve?' Checkpoint saved.':'')};
  save();tab='bulletin';render();
}
window.addEventListener('message',function(ev){var m=ev.data||{};if(ev.source===window.parent&&m.type==='dungeonResult')returned(m.result||{});});
function viewStakes(){
  var mine=w.stakes.filter(function(s){return s.by===S.BRUTUS;});
  var h='<h2>Your stakes</h2><p class="sub">Back someone from their profile. You pay up front; they pay you a quarter of their hauls for 26 weeks. How they feel about you decides the rest.</p>';
  if(!mine.length)return h+'<p class="empty">You haven\'t backed anyone yet. Find someone under People.</p>';
  h+='<table><thead><tr><th>Who</th><th>Paid</th><th>Back so far</th><th>Weeks left</th><th>How they see you</th></tr></thead><tbody>';
  mine.slice().reverse().forEach(function(s){var p=w.people[s.who];
    h+='<tr class="row" data-p="'+p.id+'"><td>'+esc(p.name)+' <span class="muted">('+p.rank+')</span>'+(p.alive?'':' <span class="pill">gone</span>')+'</td><td>'+fmt(s.amt)+'</td><td>'+fmt(s.paid)+'</td><td>'+(s.left>0?s.left:'done')+'</td><td>'+(p.alive?S.feelWord(S.feel(w,p,S.BRUTUS)):'')+'</td></tr>';});
  return h+'</tbody></table>';
}
function spark(xs,lo,hi,label,pct){
  var W=280,H=60,n=xs.length;if(n<2)return '';
  var pts=xs.map(function(v,i){return (i/(n-1)*W).toFixed(1)+','+(H-(v-lo)/(hi-lo)*H).toFixed(1);}).join(' ');
  var last=xs[n-1];
  return '<div class="card"><p class="fact">'+label+': <b style="color:var(--ink)">'+(pct?Math.round(last*100)+'%':Math.round(last))+'</b></p><svg viewBox="0 0 '+W+' '+H+'" width="100%" height="60" role="img" aria-label="'+label+' over time"><polyline points="'+pts+'" fill="none" stroke="#d8b46a" stroke-width="1.6"/></svg></div>';
}
function viewNumbers(){
  var M=w.M, rows=[['People who died',M.deaths],['Ruined, to the slums',M.dropouts],['Newcomers',M.arrivals],['Promotions',M.promos],['Busted down a rank',M.demos],
    ['Signings',M.signings],['Poached',M.poaches],['Walkouts',M.walkouts],['Guilds folded',M.collapses],['Guilds founded',M.foundings],['Coups',M.coups],
    ['Crimes',M.crimes],['Murders',M.murders],['Riots',M.riots],['Schemes started',M.schemes],['Secrets exposed',M.exposed],
    ['Stakes bought',M.stakes],['Snubs remembered',M.snubs],['Devoted paybacks',M.devoted],['Hostile betrayals',M.hostile]];
  var s=w.series, h='<h2>World numbers</h2><p class="sub">For the playtest only. Totals since week 1 of this region (seed '+w.seed+').</p><div class="grid">';
  h+=spark(s.pop,0,Math.max.apply(null,s.pop)*1.1,'People in the region')+spark(s.strained,0,.5,'Share scraping by or in debt',true)+spark(s.free,0,Math.max(20,Math.max.apply(null,s.free)),'Free agents')+spark(s.guilds,0,15,'Guilds standing');
  h+='</div><table class="nums"><tbody>'+rows.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+fmt(r[1])+'</td></tr>';}).join('')+'</tbody></table>';
  return h;
}
function profile(id){
  var p=w.people[id];if(!p)return;
  var friends=Object.keys(p.feel).filter(function(k){return k!==S.BRUTUS&&w.people[k].alive&&p.feel[k]>40;}).sort(function(a,b){return p.feel[b]-p.feel[a];}).slice(0,3).map(function(k){return w.people[k].name;});
  var foes=Object.keys(p.feel).filter(function(k){return k!==S.BRUTUS&&w.people[k].alive&&p.feel[k]<-40;}).sort(function(a,b){return p.feel[a]-p.feel[b];}).slice(0,3).map(function(k){return w.people[k].name;});
  var kin=p.kin.map(function(k){return w.people[k];}).filter(function(x){return x.alive;}).map(function(x){return x.name;});
  var lover=p.lover!=null&&w.people[p.lover].alive?w.people[p.lover].name:null;
  var seen=w.events.filter(function(e){return !e.hidden&&e.kind!=='coop'&&e.actors.indexOf(p.id)>=0;}).slice(-6).reverse();
  var price=S.brutusStakeCost(p), mine=backed(p.id);
  var h='<h3>'+esc(p.name)+'</h3><p class="muted">'+p.rank+'-rank · '+esc(S.gname(w,p.guild))+(S.leader(w,p.guild)===p?' (leads it)':'')+' · '+S.standing(p)+(p.jail?' · locked up for '+p.jail+' more weeks':'')+'</p>';
  if(!p.alive)h+='<p class="notice bad">'+(p.slums?'Last seen in the slums.':'Dead.')+'</p>';
  h+='<p><b>Close to:</b> '+(lover?esc(lover)+' (lover)'+(friends.length||kin.length?', ':''):'')+(kin.length?esc(kin.join(', '))+' (kin)'+(friends.length?', ':''):'')+(friends.length?esc(friends.join(', ')):(lover||kin.length?'':'nobody in particular'))+'</p>';
  h+='<p><b>Can\'t stand:</b> '+(foes.length?esc(foes.join(', ')):'nobody, yet')+'</p>';
  if(mine)h+='<p><b>How they see you:</b> '+S.feelWord(S.feel(w,p,S.BRUTUS))+'</p>';
  h+='<p><b>Lately:</b></p>'+(seen.length?'<ul>'+seen.map(function(e){return '<li>Week '+e.week+': '+esc(e.text)+'</li>';}).join('')+'</ul>':'<p class="empty">Nothing anyone talks about.</p>');
  h+='<div class="row2">'+(p.alive?(mine?'<span class="pill">You hold a stake</span>':'<button class="go" id="back" '+(w.brutus.gold<price?'disabled':'')+'>Back them · '+fmt(price)+' gold</button>'):'')+'<button id="close">Close</button></div>';
  var d=$('profile');d.innerHTML=h;if(!d.open)d.showModal();
  $('close').onclick=function(){d.close();};
  var b=$('back');if(b)b.onclick=function(){var r=S.brutusBack(w,p.id);notice=r.error?{bad:true,text:r.error}:{text:'You bought a stake in '+p.name+' for '+fmt(r.price)+' gold.'};save();d.close();tab='bulletin';render();};
}
function render(){
  $('week').textContent=w.week;$('gold').textContent=fmt(w.brutus.gold);
  document.querySelectorAll('nav button').forEach(function(b){if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  $('end').disabled=!!w.pending;$('end').title=w.pending?'Finish the expedition first':'';
  $('main').innerHTML={bulletin:viewBulletin,expeditions:viewExpeditions,people:viewPeople,guilds:viewGuilds,stakes:viewStakes,numbers:viewNumbers}[tab]();
  var q=$('q');if(q){q.oninput=function(){query=q.value.toLowerCase();var pos=q.selectionStart;render();var n=$('q');n.focus();n.setSelectionRange(pos,pos);};}
  document.querySelectorAll('[data-delve]').forEach(function(el){el.onclick=function(){deploy(+el.dataset.delve);};});
  document.querySelectorAll('[data-deck]').forEach(function(el){el.onclick=function(){w.brutus.deck=el.dataset.deck;save();render();};});
  document.querySelectorAll('[data-p]').forEach(function(el){el.onclick=function(ev){ev.stopPropagation();if(el.dataset.p!=='')profile(+el.dataset.p);};});
}
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){tab=b.dataset.tab;render();};});
$('end').onclick=function(){if(w.pending)return;notice=null;S.step(w);save();tab='bulletin';render();window.scrollTo(0,0);};
$('newWorld').onclick=function(){if(!confirmNew())return;fresh(Date.now());notice={text:'A new region. Seed '+w.seed+'.'};tab='bulletin';render();};
function confirmNew(){var b=$('newWorld');if(b.dataset.armed){delete b.dataset.armed;b.textContent='New region';return true;}b.dataset.armed='1';b.textContent='Click again to start over';setTimeout(function(){delete b.dataset.armed;b.textContent='New region';},3000);return false;}
// the shell watches for a run id on #living to know when a new run starts
var marker=document.createElement('div');marker.id='living';marker.hidden=true;document.body.appendChild(marker);
if(!load())fresh(20261025);
if(w.pending){w.pending=null;save();}   // a reload mid-expedition loses that trip, as in the main build
marker.dataset.runId='px-'+w.seed;
window.PXWorld=function(){return w;};
// the dungeon frame asks the overworld about NPC parties it meets; this experiment has none
window.BOBOWWorld={request:function(){return {error:'No dungeon parties in the personality experiment'};}};
render();
})();
</script>
